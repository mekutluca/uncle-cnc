<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var match = document.cookie.match(/(?:^|; )PARAGLIDE_LOCALE=([^;]+)/);
					var locale = match ? decodeURIComponent(match[1]) : 'tr';
					var rtl = locale === 'ar' || locale === 'fa';
					document.documentElement.lang = locale;
					document.documentElement.dir = rtl ? 'rtl' : 'ltr';
				} catch (e) {}
			})();
		</script>
		<script>
			(function () {
				try {
					var match = document.cookie.match(/(?:^|; )ACCENT_THEME=([^;]+)/);
					var accent = match ? decodeURIComponent(match[1]) : '';
					if (accent === 'yellow' || accent === 'red' || accent === 'red-contrast') {
						document.documentElement.setAttribute('data-accent', accent);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
